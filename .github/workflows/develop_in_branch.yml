# workflow to show how to develop workflows in branches

name:  Develop in branch

on: [pull_request, workflow_dispatch]

jobs:
  job1:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
      
    steps:
      - run: |
          echo "Workflow triggered in branch ${{github.ref}}."
          echo "Workflow triggered by event ${{github.event_name}}."
          echo "PR title is ${{github.event.pull_request.title}}."
          echo "Workflow triggered by ${{github.actor}}."          
      - run: |
          echo "::debug::This is a debug message."
          echo "::notice::This is a notice message."
          echo "::warning::This is a warning message."
          echo "::error::This is an error message."
      - run: |
          echo "::notice file=.github/workflows/develop_in_branch.yml,line=22::There is a debug message that is not always visible."
          echo "::warning file=.github/workflows/develop_in_branch.yml,line=22,endiline=25::A lot of messages."
          echo "::error title=Script Injection,file=.github/workflows/develop_in_branch.yml,line=19::Potential script injection."
      - uses: actions/checkout@v4.1.0      
      - uses: devops-actions/actionlint@v0.1.2
      
      
          
      
